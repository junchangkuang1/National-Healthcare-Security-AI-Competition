[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thyroidxl-competition"
version = "0.1.0"
description = "Anonymized multi-task thyroid ultrasound pipeline for the National Healthcare Security AI Competition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "nibabel>=5.2",
  "openpyxl>=3.1",
  "pydicom>=2.4",
  "segmentation-models-pytorch>=0.5.0",
  "timm>=0.9",
  "torch>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

